name: Intel release smoke test (public, standard runner)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test, for example v0.1.4 (pre-releases work)
        required: true
      sha256:
        description: SHA-256 of the x64 DMG, from that release's SHA256SUMS file
        required: true
permissions:
  contents: read
jobs:
  intel:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set test paths
        env:
          TAG: ${{ inputs.tag }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "Invalid tag: $TAG"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid SHA-256"; exit 1; }
          version="${TAG#v}"
          version="${version%%-rc.*}"
          printf 'MACUTILITY_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'MACUTILITY_SHA256=%s\n' "$SHA256" >> "$GITHUB_ENV"
          printf 'MACUTILITY_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'MACUTILITY_DMG=%s\n' "MacUtility-$version-x64.dmg" >> "$GITHUB_ENV"
          printf 'MACUTILITY_TEST_APP=%s\n' "$RUNNER_TEMP/MacUtility.app" >> "$GITHUB_ENV"
          printf 'MACUTILITY_REPORT_DIR=%s\n' "$GITHUB_WORKSPACE/intel-report" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confirm native Intel runner
        run: test "$(uname -m)" = x86_64
      - name: Download approved public candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MACUTILITY_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MACUTILITY_DMG" --dir "$RUNNER_TEMP"
          printf '%s  %s\n' "$MACUTILITY_SHA256" "$RUNNER_TEMP/$MACUTILITY_DMG" | shasum -a 256 -c -
      - name: Mount DMG and copy packaged app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/macutility-mount"
          hdiutil attach "$RUNNER_TEMP/$MACUTILITY_DMG" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/macutility-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/macutility-mount"' EXIT
          ditto "$RUNNER_TEMP/macutility-mount/MacUtility.app" "$MACUTILITY_TEST_APP"
      - name: Install test harness dependency only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.0
      - name: Run packaged Intel checks
        run: node qa/intel-smoke.mjs
      - name: Write job summary
        if: always()
        run: |
          if test -f intel-report/REPORT.md; then cat intel-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"; else printf '%s\n' 'Intel run failed before the app checks. See step logs; no passing app report was produced.' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-report-${{ github.run_id }}
          path: intel-report/
          retention-days: 3
          if-no-files-found: warn
